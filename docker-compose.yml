version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clashdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clashdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clashdata}
      POSTGRES_DB: ${POSTGRES_DB:-clashdata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clashdata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clashdata-network

  redis:
    image: redis:7-alpine
    container_name: clashdata-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clashdata-network

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: clashdata-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL:-postgresql://clashdata:clashdata@postgres:5432/clashdata}
      
      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGIN: ${BETTER_AUTH_TRUSTED_ORIGIN}
      BETTER_AUTH_TRUSTED_DOMAIN: ${BETTER_AUTH_TRUSTED_DOMAIN:-}
      
      # Server
      PORT: ${BACKEND_PORT:-3000}
      NODE_ENV: production
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-${BETTER_AUTH_TRUSTED_ORIGIN}}
      
      # Clash of Clans API
      TOKEN_COC: ${TOKEN_COC}
      
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clashdata-network
    healthcheck:
      test: ["CMD", "bun", "run", "--silent", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: clashdata-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - backend
    networks:
      - clashdata-network
    healthcheck:
      test: ["CMD", "bun", "run", "--silent", "-e", "fetch('http://localhost:3001').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  clashdata-network:
    driver: bridge

